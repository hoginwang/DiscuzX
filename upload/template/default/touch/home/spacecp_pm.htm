<!--{template common/header}-->
<!--{if $op != ''}-->
	<div class="threadlist_box mt10 cl">
		<div class="threadlist cl">
			<ul>
				<h4>{lang user_mobile_pm_error}</h4>
			</ul>
		</div>
	</div>
<!--{else}-->
<form id="pmform_{$pmid}" name="pmform_{$pmid}" method="post" autocomplete="off" action="home.php?mod=spacecp&ac=pm&op=send&touid=$touid&pmid=$pmid&mobile=2&formhash={FORMHASH}" >
	<input type="hidden" name="referer" value="{echo dreferer();}" />
	<input type="hidden" name="pmsubmit" value="true" />
	<input type="hidden" name="formhash" value="{FORMHASH}" />
	<div class="header cl">
		<div class="mz"><a href="home.php?mod=space&do=pm"><i class="dm-c-left"></i></a></div>
		<h2>{lang send_pm}</h2>		
	</div>
	<div class="post_box">
		<ul>
			<!--{if !$touid}-->
			<li class="mli"><input type="text" value="" tabindex="1" class="px" autocomplete="off" id="username" name="username" placeholder="{lang addressee}"></li>
			<!--{/if}-->
			<li class="mtext">
				<textarea class="pt" tabindex="2" autocomplete="off" value="" id="sendmessage" name="message" placeholder="{lang thread_content}"></textarea>
			</li>
		</ul>
	</div>	
	<div class="post_btn"><button id="pmsubmit_btn" class="pn btn_pn mgrey" disable="true">{lang sendpm}</button></div>
</form>
<script type="text/javascript">
	(function() {
		qSel("#sendmessage").addEventListener("keyup", function() {
			var obj = this;
			if(obj.value) {
				qSel(".btn_pn").classList.remove("mgrey");
				qSel(".btn_pn").classList.add("mblue");
				qSel(".btn_pn").setAttribute("disable", "false");
			} else {
				qSel(".btn_pn").classList.remove("mblue");
				qSel(".btn_pn").classList.add("mgrey");
				qSel(".btn_pn").setAttribute("disable", "true");
			}
		});
		var form = qSel("#pmform_{$pmid}");
		qSel("#pmsubmit_btn").addEventListener("click", function() {
			var obj = this;
			if(obj.getAttribute("disable") == "true") {
				return false;
			}
			var xhr = new XMLHttpRequest();
			xhr.open("POST", form.getAttribute("action") + '&handlekey='+form.getAttribute("id")+'&inajax=1');
			xhr.onreadystatechange = function() {
				if (xhr.readyState === 4 && xhr.status === 200) {
					var s = xhr.responseXML;
					if (typeof(s) != undefined) {
						popup.open(s.lastChild.firstChild.nodeValue);
					}
				}
			};
			xhr.send(new FormData(form));
			return false;
		});
	})();
</script>
<!--{/if}-->
<!--{template common/footer}-->
