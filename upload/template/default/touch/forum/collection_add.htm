<!--{template common/header}-->
<div class="header cl">
	<div class="mz"><a href="javascript:history.back();"><i class="dm-c-left"></i></a></div><h2></h2><div class="my"></div>
</div>
<div class="header_toplogo">
	<img src="{IMGDIR}/logo_m.svg" />
	<p>
		<!--{if $op == 'edit'}-->
		{lang collection_edit}
		<!--{else}-->
		{lang collection_create}
		<!--{/if}-->
	</p>
</div>
<form class="mobileformbox" action="forum.php?mod=collection&action=edit" onsubmit="return checklen();" method="POST">
	<div class="mobileformitem">
		<input id="formtitle" class="px" type="text" name="title" value="{$_G['collection']['name']}" placeholder="{lang collection_title}" autocomplete="off" tabindex="1" />
		<!--{if $op != 'edit'}-->
		<span>{lang collection_remain_tips}</span>
		<!--{/if}-->
	</div>
	<div class="mobileformitem">
		<textarea id="formdesc" class="w100" name="desc" rows="10" placeholder="{lang collection_desc}" tabindex="2">{$_G['collection']['desc']}</textarea>
	</div>
	<div class="mobileformitem">
		<input id="formkeyword" class="w100" type="text" name="keyword" value="{$_G['collection']['keyword']}" placeholder="{lang collection_keywords}" autocomplete="off" tabindex="3"/>
		<span>{lang collection_keywords_desc}</span>
	</div>
	<div class="mobileformitem">
		<button class="w100" type="submit" tabindex="4"><!--{if $op == 'edit'}-->{lang collection_edit}<!--{else}-->{lang collection_create}<!--{/if}--></button>
	</div>
	<input type="hidden" value="1" name="submitcollection" />
	<input type="hidden" value="{$op}" name="op" />
	<input type="hidden" value="{$ctid}" name="ctid" />
	<input type="hidden" name="formhash" id="formhash" value="{FORMHASH}" />
	<input type="hidden" name="collectionsubmit" id="collectionsubmit" value="submit" />
</form>
<script>
	var titlelimit = '$titlelimit';
	var desclimit = '$desclimit';
	function checklen() {
		if(mb_strlen($("formtitle").value) > titlelimit) {
			showError({lang collection_title_exceed});
			return false;
		}
		if(mb_strlen($("formdesc").value) > desclimit) {
			showError({lang collection_desc_exceed});
			return false;
		}
		return true;
	}
</script>
<!--{template common/footer}-->
