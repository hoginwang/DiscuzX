<!--{template common/header}-->
<div class="header cl">
	<div class="mz"><a href="javascript:history.back();"><i class="dm-c-left"></i></a></div>
	<h2>
		{lang collection_commentlist}
	</h2>
	<div class="my">
	<!--{if helper_access::check_module('collection')}-->
	<a href="forum.php?mod=collection&amp;action=edit"><i class="dm-plus-c"></i></a>
	<!--{else}-->
	<a href="<!--{if $_G['setting']['mobile']['mobilehotthread']}--><!--{if !empty($_G['setting']['grid']['showgrid'])}-->forum.php<!--{else}-->forum.php?mod=guide&view=newthread<!--{/if}--><!--{else}-->forum.php?forumlist=1<!--{/if}-->"><i class="dm-house"></i></a>
	<!--{/if}-->
	</div>
</div>
<script type="text/javascript" src="{$_G[setting][jspath]}home_friendselector.js?{VERHASH}"></script>
<script type="text/javascript">
	var fs;
	var clearlist = 0;
</script>
<div class="mobilelistbox">
	<div class="mobilelistitem">
		<span style="float: right;">
			$avgrate {lang collection_totalrates}
		</span>
		<h2>
			<a href="forum.php?mod=collection&action=view&ctid={$_G['collection']['ctid']}">{$_G['collection']['name']}</a>
		</h2>
		<span>
			{$_G['collection']['desc']}
		</span>
	</div>
</div>
<!--{if $_G['collection']['commentnum'] > 0}-->
<form action="forum.php?mod=collection&action=comment&op=del" method="POST" class="mobileformbox">
	<div class="dhnv flex-box cl">
		<a class="flex mon" href="forum.php?mod=collection&action=view&op=comment&ctid={$_G['collection']['ctid']}">{lang collection_commentlist}</a>
		<a class="flex" href="forum.php?mod=collection&action=view&op=followers&ctid={$_G['collection']['ctid']}">{lang collection_followlist}</a>
		<!--{hook/collection_nav_extra}-->
	</div>
	<!--{loop $commentlist $comment}-->
	<div class="mobilelistitem">
		<!--{if $permission}-->
		<input type="checkbox" value="$comment[cid]" name="delcomment[]" />
		<!--{/if}-->
		<span>
			<a href="home.php?mod=space&uid={$comment['uid']}">$comment[username]</a>
			$comment[dateline]:
		</span>
		<!--{if trim($comment[message])}--><p{if $comment[rateimg]} class="mbn"{/if}>$comment[message]</p><!--{/if}-->
	</div>
	<!--{/loop}-->
	<!--{if $permission}-->
	<div class="mobileformitem">
		<button type="submit" class="w100">{lang delete}</button>
	</div>
	<input type="hidden" value="{$ctid}" name="ctid" />
	<input type="hidden" name="formhash" id="formhash" value="{FORMHASH}" />
	<!--{/if}-->
	<!--{if $multipage}-->$multipage<!--{/if}-->
</form>
<!--{/if}-->
<!--{if $_G['group']['allowcommentcollection']}-->
<form id="form_addComment" class="mobileformbox" name="form_addComment" action="forum.php?mod=collection&action=comment&ctid={$_G['collection']['ctid']}" method="POST">
	<div class="mobileformitem">
		<textarea class="w100" name="message" placeholder="{lang collection_ratecollection}"></textarea>
	</div>
	<div class="bm_c {if $memberrate}bbda{/if}">
		<!--{if !$memberrate}-->
			<!-- 打分，暂无 -->
		<!--{/if}-->
		<div class="mobileformitem">
			<button id="btnCommentSubmit" class="w100" type="submit">{lang collection_comment_submit}</button>
		</div>
	</div>
	<!--{if $memberrate}-->
		<div class="bm_c ptn pbn cl">
			<span class="z">{lang collection_rated}&nbsp;</span>
			<span class="clct_ratestar"><span class="star star$memberrate"></span></span>
		</div>
	<!--{/if}-->
	<input type="hidden" name="inajax" value="1">
	<input type="hidden" name="handlekey" value="k_addComment">
</form>
<!--{/if}-->
<!--{template common/footer}-->
