<div id="post_new"></div>
<div class="plc cl">
	<form method="post" autocomplete="off" id="fastpostform" action="forum.php?mod=post&action=reply&fid=$_G['fid']&tid=$_G['tid']&extra=$_GET['extra']&replysubmit=yes&mobile=2">
	<input type="hidden" name="formhash" value="{FORMHASH}" />
	<span class="avatar"><img style="height:32px;width:32px;" src="<!--{avatar($_G['uid'], 'small', true)}-->" /></span>  
	<div class="pi">
		<ul class="fastpost">
		<!--{if $_G['forum_thread']['special'] == 5 && empty($firststand)}-->
		<li>
		<select id="stand" name="stand" >
			<option value="">{lang debate_viewpoint}</option>
			<option value="0">{lang debate_neutral}</option>
			<option value="1">{lang debate_square}</option>
			<option value="2">{lang debate_opponent}</option>
		</select>
		</li>
		<!--{/if}-->
		<li><input type="text" value="{lang send_reply_fast_tip}" class="input grey" color="gray" name="message" id="fastpostmessage"></li>
		<li id="fastpostsubmitline" style="display:none;"><!--{if $secqaacheck || $seccodecheck}--><!--{subtemplate common/seccheck}--><!--{/if}--><input type="button" value="{lang reply}" class="button2" name="replysubmit" id="fastpostsubmit"><a href="forum.php?mod=post&action=reply&fid=$_G['fid']&tid=$_G['tid']&reppost=$_G['forum_firstpid']&page=$page" class="y" style="height:30px;width:30px;margin-top:7px;background:url({STATICURL}image/mobile/images/icon_photo.png) no-repeat"><span class="none">{lang reply}</span></a><!--{hook/viewthread_fastpost_button_mobile}--></li>
		</ul>
	</div>
    </form>
</div>
<script type="text/javascript">
	(function() {
		var form = qSel('#fastpostform');
		<!--{if !$_G['uid'] || $_G['uid'] && !$allowpostreply}-->
		qSel("#fastpostmessage").addEventListener("focus", function() {
			<!--{if !$_G['uid']}-->
				popup.open('{lang nologin_tip}', 'confirm', 'member.php?mod=logging&action=login');
			<!--{else}-->
				popup.open('{lang nopostreply}', 'alert');
			<!--{/if}-->
			this.blur();
		});
		<!--{else}-->
		qSel("#fastpostmessage").addEventListener("focus", function() {
			var obj = this;
			if (obj.getAttribute("color") == "gray") {
				obj.setAttribute("value", "");
				obj.classList.remove("grey");
				obj.setAttribute("color", "black");
				qSel("#fastpostsubmitline").style.display = "block";
			}
		});
		qSel("#fastpostmessage").addEventListener("blur", function() {
			var obj = this;
			if (obj.getAttribute("value") == "") {
				obj.classList.add("grey");
				obj.setAttribute("value", "{lang send_reply_fast_tip}");
				obj.setAttribute("color", "gray");
			}
		});
		<!--{/if}-->
		qSel('#fastpostmessage').addEventListener('focus', function() {
			var obj = this;
			if(obj.getAttribute('color') == 'gray') {
				obj.setAttribute('value', '');
				obj.classList.remove('grey');
				obj.setAttribute('color', 'black');
				qSel('#fastpostsubmitline').style.display = 'block';
			}
		});
		qSel('#fastpostmessage').addEventListener('blur', function() {
			var obj = this;
			if(obj.getAttribute('value') == '') {
				obj.classList.add('grey');
				obj.setAttribute('value', '{lang send_reply_fast_tip}');
				obj.setAttribute('color', 'gray');
			}
		});
		qSel('#fastpostsubmit').addEventListener('click', function(e) {
			e.preventDefault();
			var msgobj = qSel('#fastpostmessage');
			if(msgobj.value == '{lang send_reply_fast_tip}') {
				msgobj.setAttribute('value', '');
			}
			var form = qSel('form[name=fastpostform]');
			var xhr = new XMLHttpRequest();
			xhr.open('POST', form.getAttribute('action') + '&handlekey=fastpost&loc=1&inajax=1');
			xhr.onload = function() {
				if (xhr.readyState === 4 && xhr.status === 200) {
					evalscript(xhr.responseText.lastChild.firstChild.nodeValue);
				} else {
					window.location.href = obj.getAttribute('href');
					popup.close();
				}
			};
			xhr.send(new FormData(form));
		});
		qSel('#replyid').addEventListener('click', function() {
			window.scrollTo(0, document.body.scrollHeight);
			qSel('#fastpostmessage').focus();
		});

	})();

	function succeedhandle_fastpost(locationhref, message, param) {
		var pid = param['pid'];
		var tid = param['tid'];
		if(pid) {
			var xhr = new XMLHttpRequest();
			xhr.open("POST", "forum.php?mod=viewthread&tid=" + tid + "&viewpid=" + pid + "&mobile=2");
			xhr.onreadystatechange = function() {
				if (xhr.readyState === 4 && xhr.status === 200) {
					var s = xhr.responseXML;
					if (typeof(s) == undefined) {
						window.location.href = 'forum.php?mod=viewthread&tid=' + tid;
					} else {
						getID('post_new').appendChild(s.lastChild.firstChild.nodeValue);
					}
					getID('post_new').appendChild(s.lastChild.firstChild.nodeValue);
				} else {
					window.location.href = 'forum.php?mod=viewthread&tid=' + tid;
					popup.close();
				}
			}
			xhr.send();
		} else {
			if(!message) {
				message = '{lang postreplyneedmod}';
			}
			popup.open(message, 'alert');
		}
		getID('fastpostmessage').value = '';
		if(param['sechash']) {
			var seccodeimg = document.getElementsByClassName('seccodeimg')[0];
			seccodeimg.click();
		}
	}

	function errorhandle_fastpost(message, param) {
		popup.open(message, 'alert');
	}
</script>
