<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="robots" content="noindex, nofollow"/>
    <noscript>
        <meta http-equiv="refresh" content="1;url='https://pan.baidu.com/s/1-g-OadFV2lhUIwBw4SWKXA';">
    </noscript>
    <script>
        function link_jump() {
            //禁止其他网站使用我们的跳转页面
            var MyHOST = new RegExp('yueing.org');
            if (!MyHOST.test(document.referrer)) {
                location.href = '//' + MyHOST;
            }
            location.href = "{$url}";
        }
        //延时1S跳转，可自行修改延时时间
        setTimeout(link_jump, 1000);
        //延时50S关闭跳转页面，用于文件下载后不会关闭跳转页的问题
        setTimeout(function () {
            window.opener = null;
            window.close();
        }, 50000);
    </script>
    <title>页面加载中,请稍候...</title>
    <style type="text/css">
        html, body, div, span, applet, object, iframe, h1, h2, h3, h4, h5, h6, p, blockquote, pre, a, abbr, acronym, address, big, cite, code, del, dfn, em, img, ins, kbd, q, s, samp, small, strike, strong, sub, sup, tt, var, b, u, i, center, dl, dt, dd, ol, ul, li, fieldset, form, label, legend, table, caption, tbody, tfoot, thead, tr, th, td, article, aside, canvas, details, embed, figure, figcaption, footer, header, hgroup, menu, nav, output, ruby, section, summary, time, mark, audio, video {
            margin: 0;
            padding: 0;
            border: 0;
            font-size: 100%;
            font: inherit;
            vertical-align: baseline
        }

        body {
            background: #3498db;
        }

        #loader-container {
            width: 188px;
            height: 188px;
            color: white;
            margin: 0 auto;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-right: -50%;
            transform: translate(-50%, -50%);
            border: 5px solid #3498db;
            border-radius: 50%;
            -webkit-animation: borderScale 1s infinite ease-in-out;
            animation: borderScale 1s infinite ease-in-out;
        }

        #loadingText {
            font-family: 'Raleway', sans-serif;
            font-size: 1.4em;
            position: absolute;
            top: 50%;
            left: 50%;
            margin-right: -50%;
            transform: translate(-50%, -50%);
        }

        @-webkit-keyframes borderScale {
            0% {
                border: 5px solid white;
            }

            50% {
                border: 25px solid #3498db;
            }

            100% {
                border: 5px solid white;
            }
        }

        @keyframes borderScale {
            0% {
                border: 5px solid white;
            }

            50% {
                border: 25px solid #3498db;
            }

            100% {
                border: 5px solid white;
            }
        }
    </style>
</head>
<body>
<div id="loader-container"><p id="loadingText">页面加载中...</p></div>
</body>
</html>
